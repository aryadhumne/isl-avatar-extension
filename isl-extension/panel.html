<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISL Aid</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="panel">
  <div class="panel-inner">

    <!-- Header (drag handle) -->
    <header class="header">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/>
          <path d="M12 9.5V4.5a1.5 1.5 0 0 1 3 0V10"/>
          <path d="M15 9V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.6 14a1.5 1.5 0 0 1 2.4-1.8L9 15"/>
        </svg>
        <span>ISL Aid</span>
      </div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <!-- 3D Avatar Stage (current word shown inside) -->
    <div class="stage">
      <canvas id="stage"></canvas>
      <div id="now" data-kind="idle">Word</div>
    </div>

    <!-- Status -->
    <div class="status-bar-row">
      <p id="status" class="status" role="status">Loading avatar…</p>
    </div>

    <p class="display-by">Displaying by : Word/Sentence/Letter</p>

    <!-- Hidden extras kept for dist/panel.js (chips, caption, input, demo list) -->
    <div class="extras" aria-live="polite">
      <div id="chips" class="chips"></div>
      <p id="caption" class="caption">Turn on captions (CC) in the video, or type a sentence below.</p>
      <form id="form" class="row">
        <input id="text" type="text" autocomplete="off" placeholder="Type a sentence to sign" aria-label="Sentence to sign">
        <button type="submit">Sign</button>
      </form>
      <select id="demo" aria-label="Demo sentences">
        <option value="">Try a demo sentence</option>
        <option>Hello, my name is Rahul.</option>
        <option>I am going to school.</option>
        <option>I want to drink water.</option>
        <option>My father works in an office.</option>
        <option>I am learning computer science.</option>
        <option>I want to visit Pune.</option>
      </select>
    </div>

    

    <!-- Bottom-right tab: Dark mode switch -->
    <div class="corner-tab">
      <span class="tab-label">Dark mode</span>
      <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
    </div>

  </div>
</div>

<!-- External scripts only (Manifest V3 blocks all inline scripts) -->
<script src="theme.js"></script>
<script src="controls.js"></script>
<script src="close.js"></script>
<script src="dist/panel.js"></script>
</body>
</html>
